allprojects { tasks.withType(Test).configureEach {
 outputs.upToDateWhen { false }
 filter { includeTestsMatching '*Audit151*'; includeTestsMatching '*Goal*' }
 testLogging { events 'failed'; exceptionFormat 'full'; showStandardStreams=false }
 afterSuite { descriptor,result -> if(descriptor.className!=null) println("Checked ${descriptor.className}: ${result.testCount} tests, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped") }
}}